name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with wayland submodules)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install libwayland, weston, and the libwayland build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-client0 libwayland-server0 weston \
            meson ninja-build pkg-config libffi-dev libexpat1-dev

      - name: Build libwayland from the submodule
        run: eng/build-wayland.sh

      # The oldest libwayland the bindings claim to work on. Pinned rather than
      # taken from the runner image, so the floor is a decision in this repo and
      # not an accident of what Ubuntu happens to package this month.
      - name: Build the oldest supported libwayland
        run: eng/build-wayland.sh --version 1.22.0

      - name: Report libwayland versions
        run: |
          sed -n "s/^\s*version: '\(.*\)',$/submodule:    \1/p" external/wayland/meson.build | head -1
          echo "floor:        1.22.0"
          dpkg-query -W -f='distribution: ${Version}\n' libwayland-server0

      - name: Build
        run: dotnet build -c Release

      # The submodule is the version Native/generated/ was produced from, so it
      # is the one the bindings are actually written against.
      #
      # WAYLANDSHARPEST_REQUIRE_LIBWAYLAND makes the run fail if it did not get
      # that library: a bad LD_LIBRARY_PATH otherwise falls back to the system
      # copy in silence, and the version-gated tests just skip.
      - name: Test (submodule libwayland)
        run: dotnet test -c Release --no-build
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/artifacts/wayland/lib
          WAYLANDSHARPEST_REQUIRE_LIBWAYLAND: "1.26"

      # Everything newer than the floor is reached behind a runtime probe, and
      # those tests skip here. This run is what keeps the probes honest: calling
      # a too-new symbol unconditionally is invisible on a modern libwayland and
      # breaks the binding outright on an older one.
      - name: Test (oldest supported libwayland)
        run: dotnet test -c Release --no-build
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/artifacts/wayland-1.22.0/lib

      # And once against the runner's own packages, which is what a consumer
      # installing from apt actually links.
      - name: Test (distribution libwayland)
        run: dotnet test -c Release --no-build

      - name: Sample smoke test (headless weston)
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          weston --backend=headless --socket=ci-smoke --idle-time=0 > weston.log 2>&1 &
          weston_pid=$!
          sleep 2

          # The sample runs until its window is closed; nothing closes it
          # headlessly, so a timeout kill (124) after mapping is the pass case.
          # Only the client gets the submodule libraries: weston is already
          # running against the distribution's, which is the realistic pairing.
          set +e
          WAYLAND_DISPLAY=ci-smoke \
          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/artifacts/wayland/lib" timeout 8 \
            dotnet samples/ShmWindow/bin/Release/net10.0/ShmWindow.dll > sample.log 2>&1
          status=$?
          set -e

          kill "$weston_pid" 2>/dev/null || true
          echo "--- sample output ---"
          cat sample.log

          if [ "$status" -ne 124 ]; then
            echo "Sample exited with status $status before the timeout; expected it to stay mapped."
            echo "--- weston log ---"
            cat weston.log
            exit 1
          fi
          grep -q "Window mapped" sample.log

      # Not artifacts/ itself: the libwayland build lives there.
      - name: Pack
        run: |
          dotnet pack src/WaylandSharpest/WaylandSharpest.csproj -c Release --no-build -o artifacts/packages
          dotnet pack src/WaylandSharpest.Protocols/WaylandSharpest.Protocols.csproj -c Release --no-build -o artifacts/packages

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error

  managed:
    name: Managed transport (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test the managed transport
        shell: bash
        run: |
          dotnet test tests/WaylandSharpest.Tests -c Release --no-build \
            --filter "FullyQualifiedName~WaylandSharpest.Tests.Managed" \
            --logger "trx;LogFileName=managed.trx"

          passed=$(grep -o 'passed="[0-9]*"' tests/WaylandSharpest.Tests/TestResults/managed.trx | head -1 | tr -d 'passed="')
          echo "managed transport tests passed: $passed"
          if [ "${passed:-0}" -lt 100 ]; then
            echo "Only $passed managed-transport tests ran; the filter has stopped matching."
            exit 1
          fi

      - name: Test the generator
        run: dotnet test tests/WaylandSharpest.Generator.Tests -c Release --no-build
